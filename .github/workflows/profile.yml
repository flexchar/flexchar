# Refreshes the activity card and the latest blog posts in README.md.
#
# Needs repository secret GH_STATS_TOKEN: a classic personal access token with the
# `repo` and `read:user` scopes. The built-in GITHUB_TOKEN only sees this repository,
# so it cannot count activity in other private repos. Only totals end up in the repo.
name: Refresh profile

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile.ts
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate
        run: bun run scripts/profile.ts
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}

      - name: Commit if changed
        run: |
          git add README.md assets/activity-*.svg
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile"
          git push
